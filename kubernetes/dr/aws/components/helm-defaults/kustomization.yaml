---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
# HelmRelease defaults for the DR cluster (the home cluster injects equivalents from cluster-apps).
# A fresh DR cluster installs everything at once, so installs retry indefinitely instead of stalling.
apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patches:
  - target:
      group: helm.toolkit.fluxcd.io
      kind: HelmRelease
    patch: |-
      apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      metadata:
        name: _
      spec:
        install:
          crds: CreateReplace
          remediation:
            retries: -1
        upgrade:
          cleanupOnFail: true
          crds: CreateReplace
          remediation:
            retries: 3
            remediateLastFailure: true
