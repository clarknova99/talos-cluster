---
# sensei-prod, reusing the home manifests. Replica counts and CronJob suspension come from the
# dr-vars ConfigMap, which dr-agent sets per mode (drill / failover / maintenance).
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: sensei-prod-api
  namespace: flux-system
spec:
  targetNamespace: sensei
  path: ./kubernetes/apps/sensei/sensei-prod/api
  dependsOn:
    - name: dr-postgres
    - name: dr-repos-oci
  components:
    - ../../../../dr/aws/components/helm-defaults
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: dr-vars
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  patches:
    - target:
        kind: HelmRelease
        name: sensei-prod-api
      patch: |
        - op: add
          path: /spec/values/controllers/sensei-prod-api/replicas
          value: ${DR_API_REPLICAS}
    - target:
        kind: CronJob
      patch: |
        - op: add
          path: /spec/suspend
          value: ${DR_CRON_SUSPEND}
---
