---
# No substitution: the restore script uses shell variables.
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dr-clickhouse-restore
  namespace: flux-system
spec:
  path: ./kubernetes/dr/aws/clickhouse-restore
  dependsOn:
    - name: clickhouse
    - name: dittofeed-clickhouse
    - name: rybbit-clickhouse
  sourceRef:
    kind: GitRepository
    name: flux-system
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
