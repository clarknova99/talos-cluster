---
# CNPG operator (home chart + version). The home HelmRelease depends on openebs, which DR does not run.
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cloudnative-pg
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./kubernetes/apps/database/cloudnative-pg/app
  dependsOn:
    - name: dr-repos-helm
  components:
    - ../../../../dr/aws/components/helm-defaults
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: dr-vars
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  patches:
    - target:
        kind: HelmRelease
        name: cloudnative-pg
      patch: |
        - op: remove
          path: /spec/dependsOn
---
# Restores postgres16vector from the home WAL archive; wait=true holds the apps back until the
# restore has finished (a ~21 GB base backup plus WAL replay takes 30-60 min).
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dr-postgres
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./kubernetes/dr/aws/postgres
  dependsOn:
    - name: cloudnative-pg
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: dr-vars
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 4h
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./kubernetes/apps/database/dragonfly/app
  dependsOn:
    - name: dr-repos-oci
  components:
    - ../../../../dr/aws/components/helm-defaults
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: dr-vars
  prune: true
  wait: true
  interval: 30m
  retryInterval: 1m
  timeout: 10m
---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: dragonfly-cluster
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./kubernetes/apps/database/dragonfly/cluster
  dependsOn:
    - name: dragonfly
  components:
    - ../../../../dr/aws/components/helm-defaults
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: dr-vars
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  patches:
    - target:
        kind: Dragonfly
        name: dragonfly
      patch: |
        - op: replace
          path: /spec/replicas
          value: 1
        - op: replace
          path: /spec/serviceSpec
          value:
            type: ClusterIP
---
# Langfuse ClickHouse. The backup sidecar runs `server` instead of `watch` so DR never creates or
# prunes the home backups; restore-* Jobs (dr-clickhouse-restore) pull the latest backup through it.
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1.json
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: clickhouse
  namespace: flux-system
spec:
  targetNamespace: database
  path: ./kubernetes/apps/database/clickhouse/app
  dependsOn:
    - name: dr-repos-oci
  components:
    - ../../../../dr/aws/components/helm-defaults
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
    provider: sops
    secretRef:
      name: sops-age
  postBuild:
    substituteFrom:
      - kind: Secret
        name: cluster-secrets
      - kind: ConfigMap
        name: dr-vars
  prune: true
  wait: false
  interval: 30m
  retryInterval: 1m
  timeout: 10m
  patches:
    - target:
        kind: ReplicationSource
      patch: |
        $patch: delete
        apiVersion: volsync.backube/v1alpha1
        kind: ReplicationSource
        metadata:
          name: _
    - target:
        kind: Secret
        name: .*volsync.*
      patch: |
        $patch: delete
        apiVersion: v1
        kind: Secret
        metadata:
          name: _
    - target:
        kind: HelmRelease
        name: clickhouse
      patch: |
        - op: replace
          path: /spec/values/controllers/clickhouse/containers/clickhouse-backup/command
          value:
          - /bin/clickhouse-backup
          - server
---
