---
# yaml-language-server: $schema=https://json.schemastore.org/kustomization
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dr-system
resources:
  - ./rbac.yaml
  - ./jobs.yaml
configMapGenerator:
  - name: clickhouse-restore-script
    files:
      - ./restore.sh
generatorOptions:
  disableNameSuffixHash: true
