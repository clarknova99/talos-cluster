---
apiVersion: batch/v1
kind: Job
metadata:
  name: restore-langfuse-clickhouse
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 43200
  template:
    spec:
      serviceAccountName: clickhouse-restore
      restartPolicy: OnFailure
      containers:
        - name: restore
          image: alpine/k8s:1.36.5
          command: ["/bin/sh", "/scripts/restore.sh", "database", "clickhouse", "default.*"]
          volumeMounts:
            - name: script
              mountPath: /scripts
      volumes:
        - name: script
          configMap:
            name: clickhouse-restore-script
