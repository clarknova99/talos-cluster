---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse-restore
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: dr-clickhouse-restore
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: dr-clickhouse-restore
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: dr-clickhouse-restore
subjects:
  - kind: ServiceAccount
    name: clickhouse-restore
    namespace: dr-system
