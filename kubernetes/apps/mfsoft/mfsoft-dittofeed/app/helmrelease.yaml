---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/helmrelease-helm-v2beta2.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: &app mfsoft-dittofeed
  namespace: mfsoft
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m

  values:
    controllers:
      mfsoft-dittofeed:
        containers:
          app:
            image:
              repository: dittofeed/dittofeed-lite
              tag: v0.23.0
            env:
              PASSWORD: ${SECRET_MFSOFT_PASSWORD}
              SECRET_KEY: ${SECRET_OAUTH_CLIENT_SECRET}
              WORKSPACE_NAME: mfsoft
              NODE_ENV: production
              AUTH_MODE: single-tenant
              SESSION_COOKIE_SECURE: true
              DASHBOARD_API_BASE: https://dittofeed.${SECRET_DOMAIN_THREE}
              DASHBOARD_URL: https://dittofeed.${SECRET_DOMAIN_THREE}
              TEMPORAL_ADDRESS: mfsoft-dittofeed-temporal.mfsoft.svc.cluster.local:7233
              DATABASE_HOST: postgres16-rw.database.svc.cluster.local
              DATABASE_USER: ${SECRET_PGADMIN_USER}
              DATABASE_PASSWORD: ${SECRET_PGADMIN_PASSWORD}
              DATABASE_URL: postgresql://${SECRET_PGADMIN_USER}:${SECRET_PGADMIN_PASSWORD}@postgres16-rw.database.svc.cluster.local:5432/mfsoft_dittofeed
              CLICKHOUSE_HOST: http://mfsoft-dittofeed-clickhouse.mfsoft.svc.cluster.local:8123
              CLICKHOUSE_USER: dittofeed
              CLICKHOUSE_PASSWORD: ${SECRET_CLICKHOUSE_PASSWORD}
              # BOOTSTRAP_SAFE: "true"
    service:
      app:
        controller: mfsoft-dittofeed
        ports:
          http:
            port: &port 3000
    route:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN_THREE}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: "MFSoft"
          gethomepage.dev/icon: https://cdn.prod.website-files.com/664393f5bd2b0c6d4fdf5437/6644bdae62ceb2dabadadb5b_Group%2022.svg
          gatus.home-operations.com/endpoint: |
            group: mfsoft
        parentRefs:
          - name: envoy-internal
            namespace: network
            sectionName: https
        hostnames:
          - dittofeed.${SECRET_DOMAIN_THREE}
        rules:
          - matches:
              - path:
                  type: PathPrefix
                  value: /
            filters:
              - type: ResponseHeaderModifier
                responseHeaderModifier:
                  add:
                    - name: X-Robots-Tag
                      value: "noindex, nofollow"
            backendRefs:
              - name: *app
                port: *port
