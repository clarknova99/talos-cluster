---
# yaml-language-server: $schema=https://raw.githubusercontent.com/bjw-s-labs/helm-charts/main/charts/other/app-template/schemas/helmrelease-helm-v2.schema.json
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: mfsoft-web
  namespace: mfsoft
spec:
  chartRef:
    kind: OCIRepository
    name: app-template
    namespace: flux-system
  interval: 30m

  values:
    controllers:
      mfsoft-web:
        replicas: 1
        strategy: RollingUpdate

        annotations:
          reloader.stakater.com/auto: "true"

        containers:
          app:
            image:
              repository: ghcr.io/mfsoft-dev/mfsoft-web
              tag: main-f99d783b4757a0b9c0787eec8d489f64fcdd603e@sha256:bac07ab94b62b2a68096f811ec823f66b4a59855cac0e6bbca449744633bbf02
            env:
              POLAR_PRO_CHECKOUT_URL: ${SECRET_MFSOFT_POLAR_PRO_CHECKOUT_URL}
              POLAR_INFRA_CHECKOUT_URL: ${SECRET_MFSOFT_POLAR_INFRA_CHECKOUT_URL}
              DOWNLOAD_URL: ${SECRET_MFSOSFT_DOWNLOAD_URL}
            resources:
              requests:
                cpu: 5m
                memory: 128Mi
              limits:
                memory: 256Mi
        pod:
          # imagePullPolicy: Always
          imagePullSecrets:
            - name: mfsoft-secret
    service:
      app:
        ports:
          http:
            port: 8000
    route:
      main:
        annotations:
          external-dns.alpha.kubernetes.io/target: external.${SECRET_DOMAIN_THREE}
          gethomepage.dev/enabled: "true"
          gethomepage.dev/group: MFSoft
          gethomepage.dev/icon: kubernetes-dashboard.svg
          gatus.home-operations.com/endpoint: |
            group: mfsoft
        parentRefs:
          - name: envoy-external
            namespace: network
            sectionName: https
        hostnames:
          - ${SECRET_DOMAIN_THREE}
          - www.${SECRET_DOMAIN_THREE}
    persistence:
      data:
        enabled: true
        type: nfs
        server: 192.168.1.3
        path: /volume1/network-storage/cluster/mfsoft
        globalMounts:
          - path: /app/data
