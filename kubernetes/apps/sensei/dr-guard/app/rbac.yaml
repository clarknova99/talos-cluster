---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: dr-guard
  namespace: sensei
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-guard
  namespace: flux-system
rules:
  - apiGroups: ["kustomize.toolkit.fluxcd.io"]
    resources: ["kustomizations"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-guard
  namespace: flux-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dr-guard
subjects:
  - kind: ServiceAccount
    name: dr-guard
    namespace: sensei
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: dr-guard
  namespace: sensei
rules:
  - apiGroups: ["helm.toolkit.fluxcd.io"]
    resources: ["helmreleases"]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: ["batch"]
    resources: ["cronjobs"]
    verbs: ["get", "list", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: dr-guard
  namespace: sensei
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: dr-guard
subjects:
  - kind: ServiceAccount
    name: dr-guard
    namespace: sensei
