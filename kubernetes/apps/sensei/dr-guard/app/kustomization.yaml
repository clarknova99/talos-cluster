---
# yaml-language-server: $schema=https://raw.githubusercontent.com/fluxcd-community/flux2-schemas/main/kustomization-kustomize-v1beta1.json
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ./secret.sops.yaml
  - ./rbac.yaml
  - ./cronjob.yaml
configMapGenerator:
  - name: dr-guard-script
    namespace: sensei
    files:
      - ./dr-guard.sh
generatorOptions:
  annotations:
    # shell variables in the script must not be substituted by Flux
    kustomize.toolkit.fluxcd.io/substitute: disabled
  disableNameSuffixHash: true
