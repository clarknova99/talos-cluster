---
# yaml-language-server: $schema=https://kochhaus-schemas.pages.dev/postgresql.cnpg.io/cluster_v1.json
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres16vector
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.3-7
  primaryUpdateStrategy: unsupervised
  # Default 180 s: a smart shutdown waits that long for open sessions (e.g. a running backup)
  # before falling back to a fast shutdown. Promoting a replica cluster (failback from AWS DR)
  # always restarts the primary, and on 2026-10-05 this wait was 3 of the ~8 minutes of downtime.
  smartShutdownTimeout: 15
  storage:
    size: 50Gi
    storageClass: openebs-hostpath
    resizeInUseVolumes: False
  superuserSecret:
    name: cloudnative-pg-secrets
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_connections: "600"
      shared_buffers: 2GB # 25% of RAM
      effective_cache_size: '6GB'     #75% of RAM
      work_mem: '128MB'               # Per-operation (be conservative)
      maintenance_work_mem: '512MB'   # For VACUUM, indexes
    shared_preload_libraries:
      - "pg_stat_statements"
      # - "vectors.so"
  nodeMaintenanceWindow:
    inProgress: false
    reusePVC: true
  resources:
    requests:
      cpu: 250m
    limits:
      memory: 8Gi
  probes:
    liveness:
      timeoutSeconds: 15
      periodSeconds: 15
      failureThreshold: 5
    readiness:
      timeoutSeconds: 15
      periodSeconds: 15
      failureThreshold: 5
  monitoring:
    enablePodMonitor: true
    # Ref: https://github.com/cloudnative-pg/cloudnative-pg/issues/2501
    # podMonitorMetricRelabelings:
    #   - { sourceLabels: ["cluster"], targetLabel: cnpg_cluster, action: replace }
    #   - { regex: cluster, action: labeldrop }
 # Note: previousCluster needs to be set to the name of the previous
  # cluster when recovering from an existing cnpg cluster

  backup:
    retentionPolicy: 30d
    barmanObjectStore: &barmanObjectStore
      # snappy: ~5-10x faster backup/restore than bzip2 for a modest S3 size increase
      # (a 59 GB restore went from ~45 min with bzip2 to ~16 min with snappy, dr/RUNBOOK.md).
      # Restores read each file's own compression, so older bzip2 backups/WAL stay usable.
      data:
        compression: snappy
        jobs: 4
      wal:
        compression: snappy
        maxParallel: 8
      # destinationPath: s3://cloudnative-pg/
      # endpointURL: http://minio.kube-system.svc.cluster.local:9000

      destinationPath: s3://sensei-cnpg/
      endpointURL: https://s3.us-east-1.amazonaws.com
      # Note: serverName version needs to be incremented
      # when recovering from an existing cnpg cluster
      serverName: &currentCluster postgres16vector-v5
      s3Credentials:
        accessKeyId:
          name: cloudnative-pg-secrets
          key: SENSEI_AWS_ACCESS_KEY_ID
        secretAccessKey:
          name: cloudnative-pg-secrets
          key: SENSEI_AWS_SECRET_ACCESS_KEY

  bootstrap:
    # initdb:
    #   postInitSQL:
    #   - create EXTENSION vector
    recovery:
      source: &previousCluster postgres16vector-dr-202610050013

  # Failback from AWS DR (2026-10-05): follow the DR WAL archive as a read-only replica cluster
  # while AWS still serves; promote by setting enabled: false (dr/FAILBACK-CHECKLIST.md).
  replica:
    enabled: false
    source: *previousCluster

  # Note: externalClusters is needed when recovering from an existing cnpg cluster
  externalClusters:
    - name: *previousCluster
      barmanObjectStore:
        <<: *barmanObjectStore
        serverName: *previousCluster
