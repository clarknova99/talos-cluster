---
apiVersion: v1
kind: Pod
metadata:
  name: cnpg-logical-restore-tools
  namespace: database
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch
    seccompProfile:
      type: RuntimeDefault
  containers:
    - name: tools
      image: ghcr.io/cloudnative-pg/postgresql:17.5-7
      command: [/bin/bash, --noprofile, --norc]
      stdin: true
      tty: true
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities:
          drop: [ALL]
      env:
        - name: HOME
          value: /work
        - name: PGHOST
          value: cnpg-logical-restore-target-rw.database.svc.cluster.local
        - name: PGDATABASE
          value: template1
        - name: PGCONNECT_TIMEOUT
          value: "30"
        - name: PGSSLMODE
          value: verify-full
        - name: PGSSLROOTCERT
          value: /pg-ca/ca.crt
        - name: PGUSER
          valueFrom:
            secretKeyRef:
              name: cnpg-logical-restore-target-superuser
              key: username
        - name: PGPASSWORD
          valueFrom:
            secretKeyRef:
              name: cnpg-logical-restore-target-superuser
              key: password
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: "2"
          memory: 1Gi
      volumeMounts:
        - name: restore
          mountPath: /backup
          readOnly: true
        - name: work
          mountPath: /work
        - name: tmp
          mountPath: /tmp
        - name: ca
          mountPath: /pg-ca
          readOnly: true
  volumes:
    - name: restore
      persistentVolumeClaim:
        claimName: postgres16-logical-restore
    - name: work
      emptyDir: {}
    - name: tmp
      emptyDir: {}
    - name: ca
      secret:
        secretName: cnpg-logical-restore-target-ca
        items:
          - key: ca.crt
            path: ca.crt
