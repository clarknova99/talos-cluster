---
apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-config
  labels:
    app.kubernetes.io/name: homepage
    kustomize.toolkit.fluxcd.io/substitute: enabled
data:
  kubernetes.yaml: |
    mode: cluster
    gateway: true
    ingress: false
    traefik: false
  settings.yaml: |
    # https://raw.githubusercontent.com/walkxcode/dashboard-icons/main/ICONS.md
    # https://pictogrammers.com/library/mdi/
    # https://simpleicons.org/
    title: Dashboard
    favicon: https://github.com/walkxcode/dashboard-icons/blob/main/png/heimdall.png
    theme: dark
    headerStyle: clean
    #hideVersion: true
    #showStats: true
    quicklaunch:
      searchDescriptions: true
      hideInternetSearch: true
    layout:
      Internal:
        style: row
        columns: 3
        header: false
      Apps:
        style: row
        columns: 3
        header: true
        icon: mdi-application
      Media:
        style: row
        columns: 2
        icon: mdi-play-circle
      Observability:
        style: column
        icon: mdi-monitor-eye
      Infra:
        style: column
        icon: mdi-server-network
      Storage:
        style: column
        icon: mdi-database
      Sensei Services:
        style: row
        columns: 3
        icon: mdi-chess-queen
      Sensei Apps:
        style: row
        columns: 2
        icon: mdi-chess-rook
        Sensei App:
          style: column
          header: false
        Sensei Admin:
          style: column
          header: false

  custom.css: |
    :root {
      /* ------ Backgrounds ------ */
      --bg-charcoal:  radial-gradient(circle at top, #404040, #252525);
      --bg-zinc:      radial-gradient(circle at top, #3f3f46, #18181b);
      --bg-slate:    radial-gradient(circle at top, #3f4e68, #1c2740);
      --bg-steel:     radial-gradient(circle at top, #475569, #1e293b);
      --bg-macchiato: radial-gradient(circle at top, #363a4f, #24273a);

      /* ------ Radius ------ */
      --radius-widget: 10px;
      --radius-card:   15px;

      /* ------ Card ------ */
      --card-bg:           rgba(0, 0, 0, 0.10);
      --card-bg-hover:     rgba(0, 0, 0, 0.20);
      --card-border:       rgba(255, 255, 255, 0.10);
      --card-border-hover: #c6a0f6;
    }
    #background {
      background: var(--bg-slate) !important;
    }
    #information-widgets {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-widget);
        box-shadow: 8px 8px 8px rgba(0, 0, 0, 0.7) !important;
        padding: 12px 28px;
        margin: 20px 40px 0 40px !important;
    }
    .service-card {
        background: var(--card-bg);
        border: 1px solid var(--card-border);
        border-radius: var(--radius-card) !important;
        box-shadow: 6px 8px 10px rgba(0, 0, 0, 0.6) !important;
        margin: 21px 12px;
    }
    .service-card:hover {
        transform: scale(1.02);
        background: var(--card-bg-hover);
        border-color: var(--card-border-hover);
        box-shadow: 6px 6px 10px rgba(0, 0, 0, 0.8) !important;
    }
    .service-block {
        background: transparent;
    }
    .service-group-name {
        margin: 14px 0 0 14px !important;
    }
    .services-list {
        margin-top: 2px !important;
    }
  custom.js: ""
  bookmarks.yaml: |
    - Cloud:
        - CloudFlare:
            - icon: cloudflare.png
              href: https://dash.cloudflare.com
        - AWS Console:
            - icon: aws.png
              href: https://aws.amazon.com/console/
    - Git:
        - Renovate:
            - icon: kubernetes-dashboard.png
              href: https://app.renovatebot.com/dashboard#github/clarknova99/
        - Kubesearch:
            - icon: kubernetes-dashboard.png
              description: Helm Chart Search
              href: https://kubesearch.dev/
        - Talos Cluster:
            - icon: kubernetes-dashboard.png
              href: https://github.com/clarknova99/talos-cluster/pulls
        - Pi Cluster:
            - icon: kubernetes-dashboard.png
              href: https://github.com/clarknova99/pi-talos/pulls
        - 0nedr0p GitHub:
            - icon: kubernetes-dashboard.png
              description: Helm Chart Search
              href: https://github.com/onedr0p/home-ops
        - Cluster Template:
            - icon: kubernetes-dashboard.png
              description: Helm Chart Search
              href: https://github.com/onedr0p/flux-cluster-template
        - Homepage Icons:
            - icon: si-jpeg
              href: https://github.com/homarr-labs/dashboard-icons/blob/main/ICONS.md
        - Homepage MDI:
            - icon: si-materialdesign
              href: https://pictogrammers.com/library/mdi/
        - Homepage SI:
            - icon: si-simpleicons
              href: https://simpleicons.org/
  services.yaml: |
    ---
    - Internal:
        # - Adguard:
        #     icon: adguard-home.svg
        #     href: https://adguard.${SECRET_DOMAIN_THREE}
        #     widget:
        #       type: adguard
        #       url: https://adguard.${SECRET_DOMAIN_THREE}
        #       username: ${SECRET_MQTT_USERNAME}
        #       password: ${SECRET_MQTT_PASSWORD}
        - DS1513+:
            icon: synology-dsm.svg
            href: https://192.168.1.2:5001
            widget:
              type: diskstation
              url: https://192.168.1.2:5001
              username: ${SECRET_CAM_USERNAME}
              password: ${SECRET_MQTT_PASSWORD}
        - DS1522+:
            icon: synology.svg
            href: https://192.168.1.3:5001
            widget:
              type: diskstation
              url: https://192.168.1.3:5001
              username: ${SECRET_MQTT_USERNAME}
              password: ${SECRET_DS1522_PASSWORD}
  widgets.yaml: |
    - search:
        provider: [google]
        focus: false
        target: _blank
    - kubernetes:
        cluster:
          cpu: true
          label: cluster
          memory: true
          show: true
          showLabel: true
        nodes:
          cpu: true
          memory: true
          show: true
          showLabel: true
    - datetime:
        text_size: l
        format:
          dateStyle: long
          timeStyle: short
          hourCycle: h23
  docker.yaml: ""
